[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfromhttp"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pathfromhttp = "pathfromhttp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
